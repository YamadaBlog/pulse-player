name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the use case rather than the solution — it helps find the best API.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Pulse to do?
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you tried
