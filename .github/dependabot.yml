# Weekly, grouped dependency updates. Security fixes still arrive
# immediately as individual pull requests (Dependabot's default).
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    labels: [dependencies]
    groups:
      frameworks:
        patterns: ['lit', 'vue', 'react', 'react-dom', 'svelte', '@types/react*']
      build-and-test:
        patterns:
          - 'vite'
          - 'vitest'
          - '@vitest/*'
          - '@vitejs/*'
          - '@sveltejs/*'
          - 'tsdown'
          - 'typescript'
          - 'vue-tsc'
          - 'happy-dom'
          - '@playwright/test'
          - '@axe-core/*'
      lint:
        patterns: ['eslint', 'eslint-*', '@eslint/*', 'typescript-eslint', 'prettier', 'globals']
      minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']
