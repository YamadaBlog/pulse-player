<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pulse — plain HTML example</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 24px;
        padding: 24px;
        background: radial-gradient(ellipse at top, #1b1830, #08080d 70%);
        color: #f5f5f7;
      }
      pulse-player {
        width: min(560px, 90vw);
      }
      output {
        font:
          12px/1.5 ui-monospace,
          monospace;
        opacity: 0.7;
        min-height: 3em;
      }
    </style>
  </head>
  <body>
    <h1>Pulse, no framework</h1>

    <!-- The playlist is declared right in the markup. -->
    <pulse-player variant="auto" ambient-eq>
      <pulse-track
        src="/audio/projector-screen.mp3"
        title="Projector Screen"
        artist="HoliznaCC0"
        cover="/audio/projector-screen.svg"
      ></pulse-track>
      <pulse-track
        src="/audio/warm-fuzz.mp3"
        title="Warm Fuzz"
        artist="HoliznaCC0"
        cover="/audio/warm-fuzz.svg"
      ></pulse-track>
      <pulse-track
        src="/audio/summer-break.mp3"
        title="Summer Break"
        artist="HoliznaCC0"
        cover="/audio/summer-break.svg"
      ></pulse-track>
    </pulse-player>

    <!-- Shares the same audio session; appears once playback starts. -->
    <pulse-fab pulso></pulse-fab>

    <output id="log" aria-live="polite"></output>

    <script type="module">
      import '@pulse-music/web-component'

      const log = document.getElementById('log')
      const player = document.querySelector('pulse-player')
      for (const type of ['pulse-play', 'pulse-pause', 'pulse-trackchange', 'pulse-error']) {
        player.addEventListener(type, (e) => {
          log.textContent = `${type} → ${e.detail.track?.title ?? ''}`
        })
      }
    </script>
  </body>
</html>
