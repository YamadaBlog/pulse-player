<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Original artwork for the Pulse demo — MIT, like the rest of the repository. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4b04b"/>
      <stop offset="0.5" stop-color="#d4502a"/>
      <stop offset="1" stop-color="#43150c"/>
    </linearGradient>
    <radialGradient id="cone" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2a0e08"/>
      <stop offset="0.35" stop-color="#5a1f10"/>
      <stop offset="1" stop-color="#8a3318"/>
    </radialGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.2" fill="#fff1d6" fill-opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#dots)"/>
  <circle cx="276" cy="300" r="150" fill="url(#cone)"/>
  <g fill="none" stroke="#ffe0b0" stroke-linecap="round">
    <circle cx="276" cy="300" r="170" stroke-opacity="0.35" stroke-width="4" stroke-dasharray="2 12"/>
    <circle cx="276" cy="300" r="190" stroke-opacity="0.22" stroke-width="4" stroke-dasharray="1 16"/>
    <circle cx="276" cy="300" r="212" stroke-opacity="0.14" stroke-width="4" stroke-dasharray="1 20"/>
    <circle cx="276" cy="300" r="120" stroke-opacity="0.25" stroke-width="2"/>
    <circle cx="276" cy="300" r="86" stroke-opacity="0.25" stroke-width="2"/>
  </g>
  <circle cx="276" cy="300" r="46" fill="#f4b04b"/>
  <circle cx="262" cy="286" r="12" fill="#fff1d6" fill-opacity="0.6"/>
  <text x="56" y="104" font-family="Helvetica Neue, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-2" fill="#fff1d6">WARM</text>
  <text x="58" y="150" font-family="Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="300" letter-spacing="14" fill="#fff1d6" fill-opacity="0.85">FUZZ</text>
</svg>
