<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08080c" />
    <title>Pulse — the music player that grows with your page</title>
    <meta
      name="description"
      content="Pulse is a drop-in music player for the web: one Custom Element that works in Vue, React, Svelte, Angular or plain HTML. Container-aware sizing, nine themes, a live FFT visualiser and a floating mini player. MIT."
    />
    <link rel="canonical" href="https://yamadablog.github.io/pulse-player/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />

    <!-- Self-hosted variable fonts (SIL OFL 1.1, see /fonts/OFL.txt): no third-party request. -->
    <link
      rel="preload"
      href="/fonts/Geist-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/GeistMono-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pulse" />
    <meta property="og:title" content="Pulse — the music player that grows with your page" />
    <meta
      property="og:description"
      content="One Custom Element, every framework. Container-aware, nine themes, live visualiser, floating mini player."
    />
    <meta property="og:url" content="https://yamadablog.github.io/pulse-player/" />
    <meta property="og:image" content="https://yamadablog.github.io/pulse-player/og-banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
